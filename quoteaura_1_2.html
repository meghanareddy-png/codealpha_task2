<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QuoteAura — A spark of perspective, on demand</title>
<meta name="description" content="QuoteAura is a calm, glowing home for inspirational quotes. Draw a new spark of wisdom any time." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#FFF7ED;
    --card:#FFFFFF;
    --primary:#EA580C;
    --hover:#C2410C;
    --text:#292524;
    --secondary:#78716C;
    --accent:#FED7AA;

    --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
    --font-ui:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

    --ease: cubic-bezier(.22,1,.36,1);
    --radius-lg: 28px;
    --radius-md: 16px;
    --radius-sm: 999px;
  }

  *{ box-sizing:border-box; }

  html{ scroll-behavior:smooth; overflow-x:hidden; }

  body{
    margin:0;
    min-height:100vh;
    max-width:100vw;
    overflow-x:hidden;
    background:
      radial-gradient(60% 50% at 85% -10%, rgba(254,215,170,0.55) 0%, rgba(254,215,170,0) 60%),
      radial-gradient(50% 40% at 0% 100%, rgba(234,88,12,0.08) 0%, rgba(234,88,12,0) 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-ui);
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ---------- Layout shell ---------- */
  .page{
    width:100%;
    max-width:1180px;
    padding:28px 24px 40px;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  /* ---------- Header ---------- */
  header.site{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding-bottom:8px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    text-decoration:none;
    color:inherit;
  }

  .brand-mark{
    width:42px;
    height:42px;
    flex-shrink:0;
    filter:drop-shadow(0 6px 14px rgba(234,88,12,0.28));
  }

  .brand-name{
    font-family:var(--font-display);
    font-weight:600;
    font-size:1.35rem;
    letter-spacing:-0.01em;
  }

  .brand-name .aura-word{
    color:var(--primary);
    font-style:italic;
    font-weight:500;
  }

  .site-tagline{
    font-size:0.85rem;
    color:var(--secondary);
    letter-spacing:0.02em;
    text-align:right;
    max-width:220px;
  }

  @media (max-width:640px){
    .site-tagline{ display:none; }
  }

  /* ---------- Main / Stage ---------- */
  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:36px 0;
  }

  .stage{
    position:relative;
    width:100%;
    max-width:720px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* the "aura" — a slow-breathing halo behind the card, the brand's signature motif */
  .aura-ring{
    position:absolute;
    inset:-8% ;
    z-index:0;
    border-radius:40px;
    background:
      conic-gradient(from 0deg,
        rgba(234,88,12,0.16),
        rgba(254,215,170,0.55),
        rgba(234,88,12,0.10),
        rgba(254,215,170,0.55),
        rgba(234,88,12,0.16));
    filter:blur(38px);
    opacity:0.9;
    animation:spin 26s linear infinite;
    pointer-events:none;
  }

  .aura-ring.pulse{
    animation:spin 26s linear infinite, pulse 0.7s var(--ease);
  }

  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes pulse{
    0%{ opacity:0.9; filter:blur(38px); }
    35%{ opacity:1; filter:blur(48px); transform:scale(1.035) rotate(20deg); }
    100%{ opacity:0.9; filter:blur(38px); }
  }

  /* ---------- Card ---------- */
  .card{
    position:relative;
    z-index:1;
    width:100%;
    background:var(--card);
    border-radius:var(--radius-lg);
    padding:56px 52px 44px;
    box-shadow:
      0 1px 2px rgba(41,37,36,0.04),
      0 20px 45px -18px rgba(41,37,36,0.18),
      0 8px 20px -12px rgba(234,88,12,0.12);
    overflow:hidden;
  }

  .card::before{
    /* oversized decorative quotation glyph, sits quietly behind the words */
    content:"“";
    position:absolute;
    top:-46px;
    left:16px;
    font-family:var(--font-display);
    font-size:220px;
    line-height:1;
    color:var(--accent);
    opacity:0.55;
    pointer-events:none;
    user-select:none;
  }

  @media (max-width:640px){
    .card{ padding:42px 26px 32px; border-radius:22px; }
    .card::before{ font-size:150px; top:-30px; left:4px; }
  }

  .eyebrow-row{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px 12px;
    margin-bottom:26px;
  }

  .category-pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--accent);
    color:var(--hover);
    font-weight:700;
    font-size:0.72rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding:7px 14px;
    border-radius:var(--radius-sm);
    transition:opacity .25s ease;
  }

  .category-pill svg{ width:11px; height:11px; }

  .quote-index{
    font-size:0.75rem;
    color:var(--secondary);
    font-variant-numeric:tabular-nums;
  }

  /* live-updating quote text region */
  .quote-region{
    position:relative;
    min-height:180px;
    margin:0;
  }

  blockquote{
    margin:0;
    font-family:var(--font-display);
    font-weight:400;
    font-style:italic;
    font-size:clamp(1.35rem, 1.05rem + 1.3vw, 2.05rem);
    line-height:1.42;
    letter-spacing:-0.01em;
    color:var(--text);
    position:relative;
  }

  figcaption{
    margin-top:22px;
    display:flex;
    align-items:center;
    gap:12px;
    font-family:var(--font-ui);
  }

  .author-rule{
    width:28px;
    height:2px;
    background:var(--primary);
    border-radius:2px;
    flex-shrink:0;
  }

  .author-name{
    font-weight:700;
    font-size:0.98rem;
    color:var(--text);
  }

  /* fade / slide transition states */
  .quote-fade-out blockquote,
  .quote-fade-out figcaption{
    animation:fadeOutUp .22s var(--ease) forwards;
  }
  .quote-fade-in blockquote,
  .quote-fade-in figcaption{
    animation:fadeInUp .42s var(--ease) backwards;
  }
  figcaption{ animation-delay: 0s; }
  .quote-fade-in figcaption{ animation-delay:.06s; }

  @keyframes fadeOutUp{
    to{ opacity:0; transform:translateY(-10px); }
  }
  @keyframes fadeInUp{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .aura-ring{ animation:none; }
    .aura-ring.pulse{ animation:none; }
    .quote-fade-out blockquote, .quote-fade-out figcaption,
    .quote-fade-in blockquote, .quote-fade-in figcaption{
      animation:none !important;
    }
  }

  /* ---------- Actions ---------- */
  .actions{
    margin-top:38px;
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
  }

  .btn{
    font-family:var(--font-ui);
    font-weight:700;
    font-size:0.95rem;
    border:none;
    cursor:pointer;
    border-radius:var(--radius-sm);
    padding:14px 26px;
    display:inline-flex;
    align-items:center;
    gap:10px;
    transition:transform .18s var(--ease), background-color .18s ease, box-shadow .18s ease;
  }

  .btn:active{ transform:translateY(1px) scale(0.98); }

  .btn-primary{
    background:var(--primary);
    color:#FFF7ED;
    box-shadow:0 10px 24px -8px rgba(234,88,12,0.55);
  }
  .btn-primary:hover{ background:var(--hover); box-shadow:0 12px 26px -8px rgba(194,65,12,0.55); }

  .btn-primary svg{
    width:17px; height:17px;
    transition:transform .5s var(--ease);
  }
  .btn-primary.spin svg{ transform:rotate(180deg); }

  .btn-ghost{
    background:transparent;
    color:var(--secondary);
    border:1.5px solid #EFE7DC;
    padding:13px 18px;
  }
  .btn-ghost:hover{ color:var(--hover); border-color:var(--accent); background:#FFF9F2; }

  .btn-ghost svg{ width:16px; height:16px; }

  .btn:focus-visible, a:focus-visible{
    outline:3px solid var(--hover);
    outline-offset:3px;
  }

  .toast{
    font-size:0.82rem;
    color:var(--hover);
    font-weight:600;
    opacity:0;
    transform:translateY(-2px);
    transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{ opacity:1; transform:translateY(0); }

  .favorites-line{
    margin-top:22px;
  }

  @media (max-width:480px){
    .actions{ width:100%; }
    .btn-primary{
      order:-1;
      flex:1 1 100%;
      justify-content:center;
    }
    .btn-ghost{
      flex:1 1 0;
      justify-content:center;
    }
  }

  /* ---------- Sparks streak (playful progress badge) ---------- */
  .sparks-streak{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:22px;
    padding:9px 16px;
    background:#FFF9F2;
    border:1.5px solid var(--accent);
    border-radius:var(--radius-sm);
    font-size:0.85rem;
    font-weight:700;
    color:var(--hover);
    transition:transform .2s var(--ease);
  }

  .sparks-streak .spark-emoji{
    display:inline-block;
    font-size:1rem;
  }

  .sparks-streak.bump{
    animation:streakBump .45s var(--ease);
  }

  @keyframes streakBump{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.14); }
    100%{ transform:scale(1); }
  }

  .milestone-toast{
    position:fixed;
    left:50%;
    bottom:36px;
    transform:translate(-50%, 12px);
    background:var(--primary);
    color:#FFF7ED;
    font-weight:700;
    font-size:0.95rem;
    padding:14px 22px;
    border-radius:var(--radius-md);
    box-shadow:0 16px 34px -12px rgba(234,88,12,0.55);
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease, transform .3s var(--ease);
    z-index:50;
  }

  .milestone-toast.show{
    opacity:1;
    transform:translate(-50%, 0);
  }

  /* ---------- Footer ---------- */
  footer.site{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding-top:20px;
    border-top:1px solid rgba(41,37,36,0.07);
    color:var(--secondary);
    font-size:0.8rem;
    flex-wrap:wrap;
  }

  footer.site .brand-mark{ width:20px; height:20px; filter:none; opacity:0.9; }

  footer.site .foot-left{
    display:flex; align-items:center; gap:8px;
  }

  footer.site strong{ color:var(--text); font-weight:700; }

  footer.site .foot-right{
    color:var(--secondary);
  }

  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  /* ---------- Ambient sparks (background atmosphere) ---------- */
  .sparks-field{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
  }

  .spark-particle{
    position:absolute;
    bottom:-24px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(234,88,12,0.85) 0%, rgba(254,215,170,0.5) 65%, rgba(254,215,170,0) 100%);
    opacity:0;
    animation-name:floatUp;
    animation-timing-function:ease-in;
    animation-iteration-count:infinite;
  }

  @keyframes floatUp{
    0%{ transform:translateY(0) scale(0.7); opacity:0; }
    12%{ opacity:0.75; }
    85%{ opacity:0.35; }
    100%{ transform:translateY(-108vh) scale(1); opacity:0; }
  }

  .page{ position:relative; z-index:1; }

  @media (prefers-reduced-motion: reduce){
    .sparks-field{ display:none; }
  }

  /* ---------- Intro splash (orange heart reveal, plays once per visit) ---------- */
  .intro-screen{
    position:fixed;
    inset:0;
    z-index:999;
    display:flex;
    align-items:center;
    justify-content:center;
    background:transparent;
    transition:opacity .6s var(--ease), visibility .6s var(--ease);
  }

  .intro-screen.hide{
    opacity:0;
    pointer-events:none;
    visibility:hidden;
  }

  .heart-open-svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
  }

  .intro-aura{
    position:absolute;
    width:min(70vw, 420px);
    height:min(70vw, 420px);
    border-radius:50%;
    background:conic-gradient(from 0deg,
      rgba(234,88,12,0.20), rgba(254,215,170,0.55),
      rgba(234,88,12,0.12), rgba(254,215,170,0.55), rgba(234,88,12,0.20));
    filter:blur(50px);
    opacity:0;
    animation:introAuraIn 1s var(--ease) forwards .1s, spin 20s linear infinite 1s;
  }

  @keyframes introAuraIn{
    to{ opacity:0.85; }
  }

  .intro-logo-wrap{
    position:relative;
    width:112px;
    height:112px;
    opacity:0;
    transform:scale(0.55) rotate(-14deg);
    animation:introLogoIn .75s cubic-bezier(.2,1.4,.4,1) forwards .15s;
  }

  @keyframes introLogoIn{
    to{ opacity:1; transform:scale(1) rotate(0deg); }
  }

  .intro-logo-wrap svg{
    width:100%;
    height:100%;
    filter:drop-shadow(0 14px 30px rgba(234,88,12,0.35));
  }

  .intro-logo-wrap .intro-quote-path{
    opacity:0;
    transform-box:fill-box;
    transform-origin:50% 50%;
    transform:scale(0.6);
    animation:introMarkIn .5s ease forwards .55s;
  }

  .intro-logo-wrap .intro-quote-path-2{
    opacity:0;
    transform-box:fill-box;
    transform-origin:50% 50%;
    transform:scale(0.6);
    animation:introMarkIn .5s ease forwards .78s;
  }

  @keyframes introMarkIn{
    to{ opacity:1; transform:scale(1); }
  }

  .intro-logo-wrap .intro-spark-path{
    opacity:0;
    transform-box:fill-box;
    transform-origin:50% 100%;
    transform:scale(0.3);
    animation:sparkTwinkle 1.5s ease-in-out infinite 1.05s;
  }

  @keyframes sparkTwinkle{
    0%{ opacity:0; transform:scale(0.3); }
    18%{ opacity:1; transform:scale(1.2); }
    38%{ opacity:0.7; transform:scale(0.9); }
    60%{ opacity:1; transform:scale(1.1); }
    100%{ opacity:0.6; transform:scale(0.95); }
  }

  .intro-title{
    font-family:var(--font-display);
    font-weight:600;
    font-size:clamp(1.5rem, 1.2rem + 1vw, 2.1rem);
    letter-spacing:0.02em;
    opacity:0;
    transform:translateY(10px);
    animation:introTextIn .6s var(--ease) forwards 1.05s;
  }

  .intro-title .aura-word{
    color:var(--primary);
    font-style:italic;
    font-weight:500;
  }

  .intro-tagline{
    font-family:var(--font-ui);
    font-size:0.92rem;
    color:var(--secondary);
    opacity:0;
    transform:translateY(8px);
    animation:introTextIn .6s var(--ease) forwards 1.35s;
    text-align:center;
    max-width:280px;
    padding:0 20px;
  }

  @keyframes introTextIn{
    to{ opacity:1; transform:translateY(0); }
  }

  .intro-skip{
    position:absolute;
    bottom:34px;
    left:50%;
    transform:translateX(-50%);
    z-index:2;
    background:rgba(41,37,36,0.25);
    backdrop-filter:blur(4px);
    border:1.5px solid rgba(255,247,237,0.55);
    color:#FFF7ED;
    font-family:var(--font-ui);
    font-weight:600;
    font-size:0.82rem;
    padding:9px 18px;
    border-radius:var(--radius-sm);
    cursor:pointer;
    opacity:0;
    animation:introSkipIn .5s var(--ease) forwards .6s;
  }
  .intro-skip:hover{ background:rgba(41,37,36,0.4); border-color:#FFF7ED; }
  .intro-skip:focus-visible{ outline:3px solid #FFF7ED; outline-offset:3px; }

  @keyframes introSkipIn{
    to{ opacity:1; }
  }

  @media (prefers-reduced-motion: reduce){
    .intro-screen{ transition:opacity .3s ease; }
    #heartHoleGroup{ animation:none !important; }
    .intro-skip{ animation:none !important; opacity:1 !important; }
  }

  /* ---------- Favorite (heart) button ---------- */
  .btn-favorite svg path{ transition:fill .18s ease, stroke .18s ease; }

  .btn-favorite.active{
    color:var(--hover);
    border-color:var(--accent);
    background:#FFF3E8;
  }
  .btn-favorite.active svg path{ fill:var(--primary); stroke:var(--primary); }

  .btn-favorite.bump{ animation:favBump .4s var(--ease); }
  @keyframes favBump{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.16); }
    100%{ transform:scale(1); }
  }
  @media (prefers-reduced-motion: reduce){
    .btn-favorite.bump{ animation:none; }
  }

  /* ---------- Favorites drawer ---------- */
  .favorites-toggle{
    background:none;
    border:none;
    color:var(--secondary);
    font-size:0.78rem;
    font-weight:700;
    font-family:var(--font-ui);
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:3px;
    padding:0;
    margin-left:6px;
  }
  .favorites-toggle:hover{ color:var(--hover); }

  .favorites-panel{
    max-height:0;
    overflow:hidden;
    transition:max-height .38s var(--ease);
  }
  .favorites-panel.open{
    max-height:340px;
    overflow-y:auto;
    margin-top:16px;
    padding-top:14px;
    border-top:1px dashed #EFE3D2;
  }

  .favorite-item{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    padding:10px 2px;
    border-bottom:1px solid #F5EDE1;
  }
  .favorite-item:last-child{ border-bottom:none; }

  .fav-text{
    font-family:var(--font-display);
    font-style:italic;
    font-size:0.88rem;
    color:var(--text);
    line-height:1.4;
  }
  .fav-author{
    display:block;
    font-family:var(--font-ui);
    font-style:normal;
    font-size:0.74rem;
    color:var(--secondary);
    margin-top:3px;
  }

  .favorite-remove{
    flex-shrink:0;
    background:none;
    border:none;
    color:var(--secondary);
    cursor:pointer;
    font-size:1rem;
    line-height:1;
    padding:2px 4px;
    border-radius:6px;
  }
  .favorite-remove:hover{ color:var(--hover); background:var(--bg); }

  .favorites-empty{
    color:var(--secondary);
    font-size:0.82rem;
    padding:6px 2px 2px;
  }
</style>
</head>
<body>

<div class="intro-screen" id="introScreen" role="dialog" aria-label="QuoteAura intro">
  <svg class="heart-open-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <mask id="heartOpenMask" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
        <rect x="0" y="0" width="100" height="100" fill="#fff"/>
        <g transform="translate(50,54)">
          <g id="heartHoleGroup">
            <g transform="translate(-16,-15)">

<script>
(function(){
  "use strict";

  /* ---------- Intro splash (orange heart reveal, plays every visit) ---------- */
  (function initIntro(){
    const introScreen = document.getElementById('introScreen');
    const introSkip = document.getElementById('introSkip');
    const pageEl = document.querySelector('.page');
    if (!introScreen) return;

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (pageEl && pageEl.setAttribute) pageEl.setAttribute('inert', '');

    let dismissed = false;
    function dismissIntro(){
      if (dismissed) return;
      dismissed = true;
      introScreen.classList.add('hide');
      window.setTimeout(() => {
        introScreen.style.display = 'none';
        if (pageEl) pageEl.removeAttribute('inert');
        const newQuoteBtn = document.getElementById('newQuoteBtn');
        if (newQuoteBtn) newQuoteBtn.focus({ preventScroll:true });
      }, reduceMotion ? 60 : 620);
    }

    introSkip.addEventListener('click', dismissIntro);
    introScreen.addEventListener('click', (e) => {
      if (e.target === introScreen) dismissIntro();
    });
    document.addEventListener('keydown', function escHandler(e){
      if (!dismissed && (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ')){
        dismissIntro();
      }
    });

    window.setTimeout(dismissIntro, reduceMotion ? 400 : 6300);
    window.setTimeout(() => introSkip.focus({ preventScroll:true }), reduceMotion ? 0 : 1200);
  })();

  const quotes = [
    { text:"The best way to predict the future is to create it.", author:"Peter Drucker", category:"Purpose" },
    { text:"Do not wait for the perfect moment. Take the moment and make it perfect.", author:"Unknown", category:"Action" },
    { text:"What we think, we become.", author:"Buddha", category:"Mindset" },
    { text:"It always seems impossible until it is done.", author:"Nelson Mandela", category:"Perseverance" },
    { text:"The only limit to our realization of tomorrow is our doubts of today.", author:"Franklin D. Roosevelt", category:"Courage" },
    { text:"Creativity is intelligence having fun.", author:"Albert Einstein", category:"Creativity" },
    { text:"Simplicity is the ultimate sophistication.", author:"Leonardo da Vinci", category:"Simplicity" },
    { text:"The journey of a thousand miles begins with a single step.", author:"Lao Tzu", category:"Action" },
    { text:"Growth is the only evidence of life.", author:"John Henry Newman", category:"Growth" },
    { text:"You miss 100% of the shots you don't take.", author:"Wayne Gretzky", category:"Courage" },
    { text:"In the middle of difficulty lies opportunity.", author:"Albert Einstein", category:"Perseverance" },
    { text:"Act as if what you do makes a difference. It does.", author:"William James", category:"Purpose" },
    { text:"Change is the end result of all true learning.", author:"Leo Buscaglia", category:"Change" },
    { text:"The future belongs to those who believe in the beauty of their dreams.", author:"Eleanor Roosevelt", category:"Dreams" },
    { text:"Well done is better than well said.", author:"Benjamin Franklin", category:"Action" },
    { text:"Whether you think you can, or you think you can't — you're right.", author:"Henry Ford", category:"Mindset" },
    { text:"Success is not final, failure is not fatal: it is the courage to continue that counts.", author:"Winston Churchill", category:"Perseverance" },
    { text:"The only way to do great work is to love what you do.", author:"Steve Jobs", category:"Purpose" },
    { text:"Life is what happens when you're busy making other plans.", author:"John Lennon", category:"Wisdom" },
    { text:"Believe you can, and you're halfway there.", author:"Theodore Roosevelt", category:"Courage" },
    { text:"The two most important days in your life are the day you are born and the day you find out why.", author:"Mark Twain", category:"Purpose" },
    { text:"Everything you've ever wanted is on the other side of fear.", author:"George Addair", category:"Courage" },
    { text:"It does not matter how slowly you go as long as you do not stop.", author:"Confucius", category:"Perseverance" },
    { text:"Start where you are. Use what you have. Do what you can.", author:"Arthur Ashe", category:"Action" },
    { text:"Your time is limited, so don't waste it living someone else's life.", author:"Steve Jobs", category:"Wisdom" },
    { text:"The best time to plant a tree was twenty years ago. The second best time is now.", author:"Chinese Proverb", category:"Action" },
    { text:"Happiness is not something ready made. It comes from your own actions.", author:"Dalai Lama", category:"Mindset" },
    { text:"Dream big and dare to fail.", author:"Norman Vaughan", category:"Dreams" },
    { text:"The only person you are destined to become is the person you decide to be.", author:"Ralph Waldo Emerson", category:"Growth" },
    { text:"Small steps every day lead to big changes.", author:"Unknown", category:"Growth" },
    { text:"What lies behind us and what lies before us are tiny matters compared to what lies within us.", author:"Ralph Waldo Emerson", category:"Wisdom" },
    { text:"You are never too old to set another goal or to dream a new dream.", author:"C.S. Lewis", category:"Dreams" },
    { text:"Curiosity is the wick in the candle of learning.", author:"William Arthur Ward", category:"Creativity" },
    { text:"Do one thing every day that scares you.", author:"Eleanor Roosevelt", category:"Courage" },
    { text:"A river cuts through rock, not because of its power, but its persistence.", author:"Jim Watkins", category:"Perseverance" },
    { text:"Not all those who wander are lost.", author:"J.R.R. Tolkien", category:"Wisdom" },
    { text:"She believed she could, so she did.", author:"R.S. Grey", category:"Courage" },
    { text:"The world is full of magic things, patiently waiting for our senses to grow sharper.", author:"W.B. Yeats", category:"Wonder" },
    { text:"Somewhere, something incredible is waiting to be known.", author:"Carl Sagan", category:"Curiosity" },
    { text:"We are made of star-stuff.", author:"Carl Sagan", category:"Wonder" },
    { text:"The universe is not only queerer than we suppose, but queerer than we can suppose.", author:"J.B.S. Haldane", category:"Wonder" },
    { text:"I have not failed. I've just found ten thousand ways that won't work.", author:"Thomas Edison", category:"Perseverance" },
    { text:"That which does not kill us makes us stronger.", author:"Friedrich Nietzsche", category:"Resilience" },
    { text:"Turn your wounds into wisdom.", author:"Oprah Winfrey", category:"Wisdom" },
    { text:"Fall seven times, stand up eight.", author:"Japanese Proverb", category:"Resilience" },
    { text:"A ship in harbor is safe, but that is not what ships are built for.", author:"John A. Shedd", category:"Courage" },
    { text:"The struggle you're in today is developing the strength you need for tomorrow.", author:"Robert Tew", category:"Resilience" },
    { text:"There is no elevator to success. You have to take the stairs.", author:"Zig Ziglar", category:"Perseverance" },
    { text:"Do not go where the path may lead, go instead where there is no path and leave a trail.", author:"Ralph Waldo Emerson", category:"Courage" },
    { text:"Great things are done by a series of small things brought together.", author:"Vincent van Gogh", category:"Creativity" }
  ];

  const quoteText   = document.getElementById('quoteText');
  const authorName  = document.getElementById('authorName');
  const categoryLbl = document.getElementById('categoryLabel');
  const quoteRegion = document.getElementById('quoteRegion');
  const quoteIndexEl= document.getElementById('quoteIndex');
  const newQuoteBtn = document.getElementById('newQuoteBtn');
  const copyBtn     = document.getElementById('copyBtn');
  const toast       = document.getElementById('toast');
  const auraRing    = document.getElementById('auraRing');
  const favoriteBtn = document.getElementById('favoriteBtn');
  const favToggle   = document.getElementById('favoritesToggle');
  const favPanel    = document.getElementById('favoritesPanel');
  const favList     = document.getElementById('favoritesList');
  const favCountEl  = document.getElementById('favCount');
  const sparksField = document.getElementById('sparksField');
  const sparksStreak = document.getElementById('sparksStreak');
  const sparksStreakText = document.getElementById('sparksStreakText');
  const milestoneToast = document.getElementById('milestoneToast');

  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const FAV_KEY = 'quoteaura_favorites';

  let lastIndex = -1;
  let seenCount = 0;
  let toastTimer = null;
  let milestoneTimer = null;
  let favorites = loadFavorites();

  const MILESTONE_MESSAGES = {
    5:  "🎉 5 sparks collected — you're on a roll!",
    10: "🌟 10 sparks! Perspective looks good on you.",
    25: "🔥 25 sparks collected — certified spark-hunter!",
    50: "🏆 50 sparks! Halfway through the whole collection.",
    100:"💫 100 sparks collected — legendary status unlocked!"
  };

  function updateSparksStreak(){
    if (!sparksStreakText) return;
    sparksStreakText.textContent = seenCount + (seenCount === 1 ? " spark collected" : " sparks collected");
    if (!prefersReducedMotion && sparksStreak){
      sparksStreak.classList.remove('bump');
      void sparksStreak.offsetWidth;
      sparksStreak.classList.add('bump');
    }
    const message = MILESTONE_MESSAGES[seenCount];
    if (message) showMilestone(message);
  }

  function showMilestone(message){
    if (!milestoneToast) return;
    milestoneToast.textContent = message;
    milestoneToast.classList.add('show');
    window.clearTimeout(milestoneTimer);
    milestoneTimer = window.setTimeout(() => milestoneToast.classList.remove('show'), 2600);
  }

  function loadFavorites(){
    try{
      const raw = window.localStorage.getItem(FAV_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(err){
      return [];
    }
  }

  function saveFavorites(){
    try{
      window.localStorage.setItem(FAV_KEY, JSON.stringify(favorites));
    }catch(err){ /* storage unavailable — favorites just won't persist */ }
  }

  function isFavorite(q){
    return favorites.some(f => f.text === q.text && f.author === q.author);
  }

  function updateFavoriteButton(){
    const q = quotes[lastIndex];
    const active = q ? isFavorite(q) : false;
    favoriteBtn.classList.toggle('active', active);
    favoriteBtn.setAttribute('aria-pressed', String(active));
    favoriteBtn.querySelector('svg path').setAttribute('fill', active ? 'currentColor' : 'none');
  }

  function renderFavoritesPanel(){
    favCountEl.textContent = favorites.length;
    if (favorites.length === 0){
      favList.innerHTML = '<p class="favorites-empty">No saved sparks yet — tap "Save" on a quote you love. 😊</p>';
      return;
    }
    favList.innerHTML = favorites.map((f, i) => `
      <div class="favorite-item">
        <p class="fav-text">"${escapeHtml(f.text)}"<span class="fav-author">— ${escapeHtml(f.author)}</span></p>
        <button class="favorite-remove" data-index="${i}" aria-label="Remove this saved quote" type="button">✕</button>
      </div>
    `).join('');
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function toggleFavorite(){
    const q = quotes[lastIndex];
    if (!q) return;
    if (isFavorite(q)){
      favorites = favorites.filter(f => !(f.text === q.text && f.author === q.author));
      showToast('Removed from saved sparks');
    } else {
      favorites.push({ text:q.text, author:q.author });
      showToast('Saved to your sparks 😊');
    }
    saveFavorites();
    updateFavoriteButton();
    renderFavoritesPanel();
    if (!prefersReducedMotion){
      favoriteBtn.classList.remove('bump');
      void favoriteBtn.offsetWidth;
      favoriteBtn.classList.add('bump');
    }
  }

  function pickIndex(){
    if (quotes.length === 1) return 0;
    let idx;
    do {
      idx = Math.floor(Math.random() * quotes.length);
    } while (idx === lastIndex);
    return idx;
  }

  function render(idx, {animate} = {animate:true}){
    const q = quotes[idx];

    const paint = () => {
      quoteText.textContent = q.text;
      authorName.textContent = "— " + q.author;
      categoryLbl.textContent = q.category;
      quoteIndexEl.textContent = String(idx + 1).padStart(2,'0') + " / " + quotes.length;
    };

    if (!animate || prefersReducedMotion){
      paint();
      updateFavoriteButton();
      return;
    }

    quoteRegion.classList.remove('quote-fade-in');
    quoteRegion.classList.add('quote-fade-out');

    window.setTimeout(() => {
      paint();
      updateFavoriteButton();
      quoteRegion.classList.remove('quote-fade-out');
      quoteRegion.classList.add('quote-fade-in');
    }, 200);
  }

  function pulseAura(){
    if (prefersReducedMotion) return;
    auraRing.classList.remove('pulse');
    // force reflow so the animation can restart
    void auraRing.offsetWidth;
    auraRing.classList.add('pulse');
  }

  function spinIcon(){
    newQuoteBtn.classList.remove('spin');
    void newQuoteBtn.offsetWidth;
    newQuoteBtn.classList.add('spin');
  }

  function newQuote(){
    const idx = pickIndex();
    lastIndex = idx;
    render(idx);
    pulseAura();
    spinIcon();
    seenCount++;
    updateSparksStreak();
  }

  function showToast(message){
    toast.textContent = message;
    toast.classList.add('show');
    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(() => toast.classList.remove('show'), 1800);
  }

  async function copyQuote(){
    const q = quotes[lastIndex] || quotes[0];
    const payload = `"${q.text}" — ${q.author}`;
    try{
      await navigator.clipboard.writeText(payload);
      showToast('Copied to clipboard 🙂');
    }catch(err){
      showToast('Could not copy — select the text manually');
    }
  }

  newQuoteBtn.addEventListener('click', newQuote);
  copyBtn.addEventListener('click', copyQuote);
  favoriteBtn.addEventListener('click', toggleFavorite);

  favToggle.addEventListener('click', () => {
    const open = favPanel.classList.toggle('open');
    favToggle.setAttribute('aria-expanded', String(open));
    favToggle.textContent = ''; // rebuilt below to keep the live count span
    favToggle.append(open ? 'Hide saved sparks (' : 'Saved sparks (', favCountEl, ')');
  });

  favList.addEventListener('click', (e) => {
    const btn = e.target.closest('.favorite-remove');
    if (!btn) return;
    const idx = Number(btn.dataset.index);
    favorites.splice(idx, 1);
    saveFavorites();
    updateFavoriteButton();
    renderFavoritesPanel();
  });

  function spawnParticles(){
    if (prefersReducedMotion || !sparksField) return;
    const count = 14;
    for (let i = 0; i < count; i++){
      const p = document.createElement('span');
      p.className = 'spark-particle';
      const size = 3 + Math.random() * 5;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = Math.random() * 100 + 'vw';
      const duration = 14 + Math.random() * 12;
      p.style.animationDuration = duration + 's';
      p.style.animationDelay = (Math.random() * duration) + 's';
      sparksField.appendChild(p);
    }
  }

  // initial quote on load
  document.addEventListener('DOMContentLoaded', () => {
    const idx = pickIndex();
    lastIndex = idx;
    render(idx, {animate:false});
    renderFavoritesPanel();
    spawnParticles();
    updateSparksStreak();
  });
})();
</script>

</body>
</html>
